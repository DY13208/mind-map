name: mind-map

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-mind_map}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-mindmap}
    volumes:
      - mind-map-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PGPORT:-15432}:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-mind_map}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-mind_map}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-mindmap}
      REDIS_URL: redis://redis:6379
      COLLAB_EVENT_BUS: redis
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      WEB_PORT: ${MIND_MAP_PORT:-8080}
      GATEWAY: "1"
      HOST: "127.0.0.1"
      PORT: "1234"
      MCP_HOST: "127.0.0.1"
      MCP_PORT: "3847"
      MIND_MAP_API: "http://127.0.0.1:1234"
      COLLAB_RATE_LIMIT_PER_ROOM: "800"
      COLLAB_RATE_LIMIT_GLOBAL: "8000"
      COLLAB_V2: "1"
      SOP_OUTPUT_DIR: /app/output
      YIRAN_UPSTREAM: ${YIRAN_UPSTREAM:-http://host.docker.internal:18232}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # WorkBuddy 在宿主机写的 SOP 产物，供预览/下载
      - ./output:/app/output:ro
      # Start-Docker 自动注入的 OpenClaw Token 等（gitignore）
      - ./docker/runtime-config.local.js:/usr/share/nginx/html/runtime-config.js:ro
    ports:
      - "${MIND_MAP_PORT:-8080}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openclaw-gateway:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1234/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # OpenClaw Gateway（龙虾）：助理页 / SOP 企微待办依赖；Start-Docker 一并拉起
  # 状态目录用命名卷（避免 Windows bind mount 上 fstat ENOENT 导致 Gateway 起不来）
  # 仅把 openclaw.json 从宿主机挂进去，方便 Start-Docker 写入 token
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw/openclaw:latest}
    environment:
      HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_BIND: lan
      TZ: ${OPENCLAW_TZ:-Asia/Shanghai}
    volumes:
      - mind-map-openclaw:/home/node/.openclaw
#      - ./docker/openclaw/home/openclaw.json:/home/node/.openclaw/openclaw.json
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-4623}:18789"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  mind-map-pg:
  mind-map-openclaw:
