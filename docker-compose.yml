name: mind-map

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-mind_map}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-mindmap}
    volumes:
      - mind-map-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PGPORT:-15432}:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-mind_map}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 鏋勫缓瀹瑰櫒涓嶇户鎵垮涓绘満鐨?Clash 浠ｇ悊锛屽鍣ㄧ洿杩炲澶ф祦閲忎細琚帎鏂?
      # 锛坅pt-get 瑁?nginx 蹇呭け璐ワ級銆傚湪 .env 閲岄厤 BUILD_HTTP_PROXY 鍗冲彲閫忎紶锛?
      # 鐣欑┖鍒欎笉浣跨敤浠ｇ悊锛堥€傚悎鑳界洿杩?Debian 婧愮殑缃戠粶鐜锛夈€?
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,postgres,redis}
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-mind_map}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-mindmap}
      REDIS_URL: redis://redis:6379
      COLLAB_EVENT_BUS: redis
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      WEB_PORT: ${MIND_MAP_PORT:-8080}
      GATEWAY: "1"
      HOST: "127.0.0.1"
      PORT: "1234"
      MCP_HOST: "127.0.0.1"
      MCP_PORT: "3847"
      MIND_MAP_API: "http://127.0.0.1:1234"
      COLLAB_RATE_LIMIT_PER_ROOM: "800"
      COLLAB_RATE_LIMIT_GLOBAL: "8000"
      COLLAB_V2: "1"
      TZ: Asia/Shanghai
      HISTORY_DISPLAY_TZ: Asia/Shanghai
      SOP_OUTPUT_DIR: /app/output
      KNOWLEDGE_COMPILER_ENABLED: ${KNOWLEDGE_COMPILER_ENABLED:-true}
      KNOWLEDGE_SYNC_INTERVAL: ${KNOWLEDGE_SYNC_INTERVAL:-300}
      KNOWLEDGE_OUTPUT_DIR: /app/knowledge
      # OpenClaw 鍗峰唴浜х墿锛堝彧璇伙級锛屼緵棰勮/涓嬭浇
      OPENCLAW_DATA_DIR: /openclaw-data
      YIRAN_UPSTREAM: ${YIRAN_UPSTREAM:-http://host.docker.internal:18232}
      COGNEE_API: ${COGNEE_API:-http://192.168.0.204:8320}
      COGNEE_API_KEY: ${COGNEE_API_KEY:-}
      COGNEE_DATASET: ${COGNEE_DATASET:-liangce}
      # Docmost / Wiki SSO锛堢敱 scripts/docker-up.js 浠?.secrets/wiki.env 娉ㄥ叆锛?
      DOCMOST_APP_URL: ${DOCMOST_APP_URL:-http://localhost:3040}
      DOCMOST_DATABASE_URL: ${DOCMOST_DATABASE_URL:-}
      DOCMOST_APP_SECRET: ${DOCMOST_APP_SECRET:-}
      DOCMOST_SSO_SECRET: ${DOCMOST_SSO_SECRET:-}
      DOCMOST_INTERNAL_URL: ${DOCMOST_INTERNAL_URL:-http://docmost:3000}
      DOCMOST_SYNC_ENABLED: ${DOCMOST_SYNC_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # WorkBuddy / OpenClaw 鍐欏埌瀹夸富鏈?output 鐨勪骇鐗╋紝渚涢瑙?涓嬭浇
      - ./knowledge:/app/knowledge
      - ./output:/app/output:ro
      - mind-map-openclaw:/openclaw-data:ro
      # Start-Docker 鑷姩娉ㄥ叆鐨?OpenClaw Token 绛夛紙gitignore锛?
      - ./docker/runtime-config.local.js:/usr/share/nginx/html/runtime-config.js:ro
    ports:
      - "${MIND_MAP_PORT:-8080}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1234/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # OpenClaw Gateway锛堥緳铏撅級锛氬姪鐞嗛〉 / SOP 浼佸井寰呭姙渚濊禆锛汼tart-Docker 涓€骞舵媺璧?
  # 鐘舵€佺敤鍛藉悕鍗枫€備笉瑕佸啀 bind-mount 鍗曚釜 openclaw.json锛?
  # Windows 涓?OpenClaw 浼?rename 鍐欓厤缃紝鍗曟枃浠舵寕杞戒細 EBUSY銆?
  # Token/閰嶇疆鐢?scripts/openclaw-docker.js 缁?docker cp 娉ㄥ叆鍗峰唴銆?
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.9.3}
    environment:
      HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # 榛樿妯″瀷璧?DeepSeek锛岄伩鍏嶆棤 OPENAI_API_KEY 鏃舵墦 api.openai.com 寰楀埌 401
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

      # ===== Cognee =====
      COGNEE_BASE_URL: ${COGNEE_URL:-http://host.docker.internal:8320}
      COGNEE_PLUGIN_DATASET: liangce
      COGNEE_API_KEY: ${COGNEE_API_KEY:-}

      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_BIND: lan
      TZ: ${OPENCLAW_TZ:-Asia/Shanghai}
    extra_hosts:
      # OpenClaw 鈫?鏈満 Cognee锛坔ost.docker.internal:8320锛?
      - "host.docker.internal:host-gateway"
    volumes:
      - mind-map-openclaw:/home/node/.openclaw
      # 鏂颁骇鐗╄惤鍒板涓绘満 output锛屼笌 app 鐨?/app/output 鏄悓涓€浠芥枃浠?
      - ./output:/home/node/.openclaw/workspace/output
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-4623}:18789"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # Phase 2B 鈥?read-only Knowledge MCP (image COPY; no host source bind)
  knowledge-mcp:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 1G
    # Phase 4: entrypoint starts as root briefly to chown mounts, then gosu -> node (non-root)
    # Do NOT force user: "0:0" — that defeated Dockerfile non-root.
    build:
      context: ./integrations/knowledge-mcp
      dockerfile: Dockerfile
    image: mind-map-knowledge-mcp:0.4.0
    environment:
      KNOWLEDGE_MCP_PORT: "18792"
      KNOWLEDGE_MCP_JWT_SECRET: ${KNOWLEDGE_MCP_JWT_SECRET}
      KNOWLEDGE_MCP_JWT_ISS: openclaw-liangce
      KNOWLEDGE_MCP_JWT_AUD: knowledge-mcp
      KNOWLEDGE_MCP_JWT_TTL_SEC: ${KNOWLEDGE_MCP_JWT_TTL_SEC:-180}
      KNOWLEDGE_MCP_REPLICAS_POLICY: ${KNOWLEDGE_MCP_REPLICAS_POLICY:-single}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-mindmap}
      PGDATABASE: ${PGDATABASE:-mind_map}
      KNOWLEDGE_ROOT: /data/knowledge
      OPENWIKI_ROOMS_ROOT: /data/openwiki/rooms
      OPENWIKI_JOBS_ROOT: /data/openwiki/jobs
      OPENWIKI_GLOBAL_CONCURRENCY: ${OPENWIKI_GLOBAL_CONCURRENCY:-2}
      DOCMOST_DATABASE_URL: ${DOCMOST_DATABASE_URL:-}
      DOCMOST_APP_SECRET: ${DOCMOST_APP_SECRET:-}
      DOCMOST_INTERNAL_URL: ${DOCMOST_INTERNAL_URL:-http://docmost:3000}
      KNOWLEDGE_MCP_AUDIT_LOG: /data/audit/knowledge-mcp.jsonl
    volumes:
      - ./knowledge:/data/knowledge:ro
      - ./data/openwiki/rooms:/data/openwiki/rooms
      - ./data/openwiki/jobs:/data/openwiki/jobs
      - knowledge-mcp-audit:/data/audit
    tmpfs:
      - /tmp
    expose:
      - "18792"
    ports:
      - "127.0.0.1:${KNOWLEDGE_MCP_PORT:-18792}:18792"
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18792/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped


volumes:
  mind-map-pg:
  mind-map-openclaw:
  knowledge-mcp-audit:

