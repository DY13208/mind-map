name: mind-map

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-mind_map}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-mindmap}
    volumes:
      - mind-map-pg:/var/lib/postgresql/data
    ports:
      - "${PGBIND:-127.0.0.1}:${PGPORT:-15432}:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-mind_map}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 构建容器不继承宿主机的 Clash 代理，容器直连对大流量会被掐断
      # （apt-get 装 nginx 必失败）。在 .env 里配 BUILD_HTTP_PROXY 即可透传，
      # 留空则不使用代理（适合能直连 Debian 源的网络环境）。
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,postgres,redis}
    env_file:
      - .env
    environment:
      # 默认使用 Compose 内的 PostgreSQL；部署到既有数据库时可在 .env
      # 设置 APP_PGHOST / APP_PGPORT，避免与宿主机侧 PGHOST / PGPORT 混淆。
      PGHOST: ${APP_PGHOST:-postgres}
      PGPORT: ${APP_PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-mind_map}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-mindmap}
      REDIS_URL: redis://redis:6379
      COLLAB_EVENT_BUS: redis
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      WEB_PORT: ${MIND_MAP_HTTP_PORT:-8990}
      GATEWAY: "1"
      HOST: "127.0.0.1"
      PORT: "1234"
      MCP_HOST: "127.0.0.1"
      MCP_PORT: "3847"
      MIND_MAP_API: "http://127.0.0.1:1234"
      COLLAB_RATE_LIMIT_PER_ROOM: "800"
      COLLAB_RATE_LIMIT_GLOBAL: "8000"
      COLLAB_V2: "1"
      TZ: Asia/Shanghai
      HISTORY_DISPLAY_TZ: Asia/Shanghai
      SOP_OUTPUT_DIR: /app/output
      KNOWLEDGE_COMPILER_ENABLED: ${KNOWLEDGE_COMPILER_ENABLED:-true}
      KNOWLEDGE_SYNC_INTERVAL: ${KNOWLEDGE_SYNC_INTERVAL:-300}
      KNOWLEDGE_OUTPUT_DIR: /app/knowledge
      # OpenClaw 卷内产物（只读），供预览/下载
      OPENCLAW_DATA_DIR: /openclaw-data
      YIRAN_UPSTREAM: ${YIRAN_UPSTREAM:-http://host.docker.internal:18232}
      COGNEE_API: ${COGNEE_API:-http://192.168.0.204:8320}
      COGNEE_API_KEY: ${COGNEE_API_KEY:-}
      COGNEE_DATASET: ${COGNEE_DATASET:-liangce}
      # Docmost / Wiki SSO（由 scripts/docker-up.js 从 .secrets/wiki.env 注入）
      DOCMOST_APP_URL: ${DOCMOST_APP_URL:-http://localhost:3040}
      DOCMOST_DATABASE_URL: ${DOCMOST_DATABASE_URL:-}
      DOCMOST_APP_SECRET: ${DOCMOST_APP_SECRET:-}
      DOCMOST_SSO_SECRET: ${DOCMOST_SSO_SECRET:-}
      DOCMOST_INTERNAL_URL: ${DOCMOST_INTERNAL_URL:-http://docmost:3000}
      DOCMOST_SYNC_ENABLED: ${DOCMOST_SYNC_ENABLED:-true}

      # Knowledge MCP（Wiki）：MCP 接入页签发 wikiToken 用
      KNOWLEDGE_MCP_JWT_SECRET: ${KNOWLEDGE_MCP_JWT_SECRET:-}
      KNOWLEDGE_MCP_JWT_ISS: ${KNOWLEDGE_MCP_JWT_ISS:-openclaw-liangce}
      KNOWLEDGE_MCP_JWT_AUD: ${KNOWLEDGE_MCP_JWT_AUD:-knowledge-mcp}
      KNOWLEDGE_MCP_JWT_TTL_SEC: ${KNOWLEDGE_MCP_JWT_TTL_SEC:-7776000}
      # MCP upload_attachment：宿主机 WorkBuddy 产物目录（见 .env WORKBUDDY_HOST_DIR）
      WORKBUDDY_MOUNT: /workbuddy
      WORKBUDDY_HOST_DIR: ${WORKBUDDY_HOST_DIR:-./data/workbuddy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # WorkBuddy / OpenClaw 写到宿主机 output 的产物，供预览/下载
      - ./knowledge:/app/knowledge
      - ./output:/app/output:ro
      # WorkBuddy 产物目录（默认仓库内 ./data/workbuddy；本机可在 .env 改成真实 WorkBuddy 路径）
      - ${WORKBUDDY_HOST_DIR:-./data/workbuddy}:/workbuddy:ro
      - mind-map-openclaw:/openclaw-data:ro
      # Start-Docker 自动注入的 OpenClaw Token 等（gitignore）
      - ./docker/runtime-config.local.js:/usr/share/nginx/html/runtime-config.js:ro
    ports:
      - "${MIND_MAP_HTTP_PORT:-8990}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      knowledge-mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1234/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # OpenClaw Gateway（龙虾）：助理页 / SOP 企微待办依赖；Start-Docker 一并拉起
  # 状态用命名卷。不要再 bind-mount 单个 openclaw.json：
  # Windows 下 OpenClaw 会 rename 写配置，单文件挂载会 EBUSY。
  # Token/配置由 scripts/openclaw-docker.js 经 docker cp 注入卷内。
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.9.3}
    environment:
      HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # 默认模型走 DeepSeek，避免无 OPENAI_API_KEY 时打 api.openai.com 得到 401
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

      # ===== Cognee =====
      COGNEE_BASE_URL: ${COGNEE_URL:-http://host.docker.internal:8320}
      COGNEE_PLUGIN_DATASET: liangce
      COGNEE_API_KEY: ${COGNEE_API_KEY:-}

      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_BIND: lan
      TZ: ${OPENCLAW_TZ:-Asia/Shanghai}
    extra_hosts:
      # OpenClaw → 本机 Cognee（host.docker.internal:8320）
      - "host.docker.internal:host-gateway"
    volumes:
      - mind-map-openclaw:/home/node/.openclaw
      # 新产物落到宿主机 output，与 app 的 /app/output 是同一份文件
      - ./output:/home/node/.openclaw/workspace/output
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-4623}:18789"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # Phase 2B 鈥?read-only Knowledge MCP (image COPY; no host source bind)
  knowledge-mcp:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 1G
    # Phase 4: entrypoint starts as root briefly to chown mounts, then gosu -> node (non-root)
    # Do NOT force user: "0:0" — that defeated Dockerfile non-root.
    build:
      context: ./integrations/knowledge-mcp
      dockerfile: Dockerfile
    image: mind-map-knowledge-mcp:0.6.1
    environment:
      KNOWLEDGE_MCP_PORT: "18792"
      KNOWLEDGE_MCP_JWT_SECRET: ${KNOWLEDGE_MCP_JWT_SECRET}
      KNOWLEDGE_MCP_JWT_ISS: openclaw-liangce
      KNOWLEDGE_MCP_JWT_AUD: knowledge-mcp
      KNOWLEDGE_MCP_JWT_TTL_SEC: ${KNOWLEDGE_MCP_JWT_TTL_SEC:-180}
      KNOWLEDGE_MCP_REPLICAS_POLICY: ${KNOWLEDGE_MCP_REPLICAS_POLICY:-single}
      # Hardcoded like the `app` service: the host .env sets PGHOST=127.0.0.1 for
      # host-side tooling, which is meaningless inside the compose network.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-mindmap}
      PGDATABASE: ${PGDATABASE:-mind_map}
      KNOWLEDGE_ROOT: ${KNOWLEDGE_ROOT:-/data/knowledge}
      # 大页面支持：整页 ProseMirror JSON 可达数 MB（公司模型约 144 万字符）。
      KNOWLEDGE_WIKI_MAX_BODY: ${KNOWLEDGE_WIKI_MAX_BODY:-120000}
      KNOWLEDGE_MCP_MAX_WRITE_CHARS: ${KNOWLEDGE_MCP_MAX_WRITE_CHARS:-200000}
      KNOWLEDGE_MCP_MAX_BODY_BYTES: ${KNOWLEDGE_MCP_MAX_BODY_BYTES:-1000000}
      OPENWIKI_ROOMS_ROOT: /data/openwiki/rooms
      OPENWIKI_JOBS_ROOT: /data/openwiki/jobs
      OPENWIKI_GLOBAL_CONCURRENCY: ${OPENWIKI_GLOBAL_CONCURRENCY:-2}
      DOCMOST_DATABASE_URL: ${DOCMOST_DATABASE_URL:-}
      DOCMOST_APP_SECRET: ${DOCMOST_APP_SECRET:-}
      DOCMOST_INTERNAL_URL: ${DOCMOST_INTERNAL_URL:-http://docmost:3000}
      KNOWLEDGE_MCP_AUDIT_LOG: /data/audit/knowledge-mcp.jsonl
    volumes:
      - ./knowledge:/data/knowledge:ro
      - ./data/openwiki/rooms:/data/openwiki/rooms
      - ./data/openwiki/jobs:/data/openwiki/jobs
      - knowledge-mcp-audit:/data/audit
    tmpfs:
      - /tmp
    expose:
      - "18792"
    ports:
      # 默认只绑回环（WorkBuddy 与服务同机时的正确写法）。
      # 服务在另一台机器上时，在 .env 里设 KNOWLEDGE_MCP_BIND=0.0.0.0，
      # 并配合防火墙来源限制或 TLS 反向代理，不要直接裸露。
      - "${KNOWLEDGE_MCP_BIND:-127.0.0.1}:${KNOWLEDGE_MCP_PORT:-18792}:18792"
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18792/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped


  # ===== 公网 TLS 终止（唯一对外入口）=====
  # 路由器只把公网 8989 转到本机，所以 8989 必须是 HTTPS。
  # 宿主 8989 -> 容器 443(TLS)，再反代到 app:80（明文，只走 docker 内网）。
  # 证书放 certs/，已在 .gitignore 排除，私钥不入库。
  tls:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${MIND_MAP_PORT:-8989}:443"
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider -T 3 https://127.0.0.1/ ; c=$$?; [ $$c -eq 0 ] || [ $$c -eq 8 ]"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  mind-map-pg:
  mind-map-openclaw:
  knowledge-mcp-audit:

