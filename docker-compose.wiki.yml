services:
  docmost:
    image: docmost/docmost:${DOCMOST_VERSION:-0.96.0}
    env_file:
      - ./.secrets/wiki.env
    environment:
      APP_URL: ${DOCMOST_APP_URL:-http://localhost:3040}
      REDIS_URL: redis://docmost-redis:6379
    ports:
      - '127.0.0.1:${DOCMOST_PORT:-3040}:3000'
    volumes:
      - docmost-storage:/app/data/storage
    depends_on:
      docmost-db:
        condition: service_healthy
      docmost-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
  docmost-db:
    image: postgres:18-alpine
    env_file:
      - ./.secrets/wiki.env
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
    volumes:
      - docmost-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docmost -d docmost']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  docmost-redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - docmost-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  openwiki-runtime:
    profiles: ['wiki-runtime']
    image: mind-map-openwiki:${OPENWIKI_VERSION:-0.5.2}
    build:
      context: ./integrations/openwiki
      args:
        OPENWIKI_VERSION: ${OPENWIKI_VERSION:-0.5.2}
    environment:
      OPENWIKI_CONFIG_DIR: /data/openwiki
      OPENWIKI_MIND_MAP_MCP_URL: http://app/mcp
      MCP_TOKEN: ${MCP_TOKEN:-}
      DO_NOT_TRACK: '1'
    volumes:
      - openwiki-state:/data/openwiki
      - ./knowledge:/knowledge:ro
    entrypoint: ['/runtime/entrypoint.sh']
    command: ['integrations', 'list']
volumes:
  docmost-storage:
  docmost-db:
  docmost-redis:
  openwiki-state:
