services:
  docmost:
    build:
      context: ./integrations/docmost
      dockerfile: Dockerfile
    image: mind-map-docmost:${DOCMOST_VERSION:-0.96.0}
    env_file:
      - ./.secrets/wiki.env
    environment:
      APP_URL: ${DOCMOST_APP_URL:-http://localhost:3040}
      REDIS_URL: redis://docmost-redis:6379
    expose:
      - '3000'
    volumes:
      - docmost-storage:/app/data/storage
    depends_on:
      docmost-db:
        condition: service_healthy
      docmost-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
  wiki-gateway:
    image: nginx:1.27-alpine
    ports:
      # 绑定所有网卡，便于用本机局域网 IP 访问（与 DOCMOST_APP_URL 一致，避免跨域）
      - '${DOCMOST_PORT:-3040}:80'
    volumes:
      - ./docker/wiki-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      docmost:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  docmost-db:
    image: postgres:18-alpine
    env_file:
      - ./.secrets/wiki.env
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
    volumes:
      - docmost-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docmost -d docmost']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  docmost-redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - docmost-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  openwiki-runtime:
    profiles: ['wiki-runtime']
    image: mind-map-openwiki:${OPENWIKI_VERSION:-0.5.2}
    build:
      context: ./integrations/openwiki
      args:
        OPENWIKI_VERSION: ${OPENWIKI_VERSION:-0.5.2}
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,postgres,redis}
    environment:
      OPENWIKI_CONFIG_DIR: /data/openwiki
      OPENWIKI_MIND_MAP_MCP_URL: http://app/mcp
      MCP_TOKEN: ${MCP_TOKEN:-}
      DO_NOT_TRACK: '1'
    volumes:
      - openwiki-state:/data/openwiki
      - ./knowledge:/knowledge:ro
    entrypoint: ['/runtime/entrypoint.sh']
    command: ['integrations', 'list']
volumes:
  docmost-storage:
  docmost-db:
  docmost-redis:
  openwiki-state:
