# Wiki gateway: publish Docmost on :3040 and intercept Mind-map SSO exchange
# so Set-Cookie is issued for the Docmost origin.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen 443 ssl;
  http2 on;
  server_name _;
  client_max_body_size 100m;

  ssl_certificate     /etc/nginx/certs/xx.stillgroup.net.crt;
  ssl_certificate_key /etc/nginx/certs/xx.stillgroup.net.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_cache shared:wikiSSL:2m;
  ssl_session_timeout 10m;

  # listen 80 保留下来只做局域网/本机明文兜底（对应宿主机 3041，不对外转发）。
  # 否则只要有人把明文请求打到 TLS 端口，nginx 会直接回 497，这里 301 到 https，
  # 端口号写死 3040 —— 容器内的 $server_port 是 443，不能拿来拼对外地址。
  error_page 497 =301 https://$host:3040$request_uri;

  # 2026-09-22: 页面 JSON payload 未压缩裸传过大（908KB 内容的页面
  # /api/pages/info 响应体 3.3MB），开启 gzip 后 JSON 可压到 ~1/6。
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain;
  gzip_proxied any;

  # Docker 内置 DNS。配合下面 proxy_pass 的变量写法，把上游解析推迟到「请求时」
  # 而不是「nginx 启动时」。否则 app / docmost 容器一旦重建（IP 变化），本网关会
  # 一直拿启动时缓存的旧 IP，3040 直接 502，必须手动 nginx -s reload 才能恢复。
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /api/auth/mind-map/exchange {
    set $app_upstream app;
    # 变量型 proxy_pass 不会自动带上原请求 query string，必须显式拼接，
    # 否则 /exchange?token=... 到 app 时 token 丢失，会报「无效的登录票据」。
    proxy_pass http://$app_upstream:80/api/auth/wiki-exchange$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  location / {
    set $docmost_upstream docmost;
    proxy_pass http://$docmost_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
