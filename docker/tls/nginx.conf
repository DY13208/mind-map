# 良策（mind-map）公网 TLS 终止层
#
# 背景：路由器只把公网 8989 转发到本机（80 端口 Connection refused，443 直接超时），
# 所以对外唯一的 8989 端口必须从 HTTP 换成 HTTPS。
# 这里不动 app 容器，只加一层专门做 TLS 终止的 nginx：
#
#   浏览器 --https:8989--> 本容器 443(TLS) --http--> app:80（明文，只走 docker 内网）
#
# 换证流程：
#   1. 从证书控制台下载「Nginx」格式压缩包（含 _bundle.crt 与 .key）；
#   2. 把 _bundle.crt / .key 放进 certs/ —— **文件名必须与下面 ssl_certificate 两行完全一致**，
#      名字对不上 nginx 会 [emerg] cannot load certificate，容器直接 unhealthy；
#   3. docker compose restart tls（或 up -d --force-recreate tls），然后
#      `openssl s_client -connect 127.0.0.1:8989 -servername ai.stillgroup.net` 看 Verify return code: 0。
# 当前证书：ai.stillgroup.net（TrustAsia DV），签发 2026-11-02，2027-01-31 到期。
# 历史证书：xx.stillgroup.net.crt/.key 仍留在 certs/（另有 _bak-20261104/ 备份），勿删以免影响 wiki-gateway。

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # app 侧 /api/attachments 允许 220m，这里不能小于它，否则大附件在 TLS 层就被拒
  client_max_body_size 220m;

  log_format tls_main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log tls_main;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/ai.stillgroup.net_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/ai.stillgroup.net.key;

    # 只留 TLS 1.2 / 1.3，关掉 1.0 / 1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 有人用 http:// 打 8989 时 nginx 报 497，这里直接跳 https，避免浏览器报协议错误
    error_page 497 =301 https://$http_host$request_uri;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 这里刻意不开 HSTS：HSTS 按「主机」生效、不区分端口，一旦下发，
    # 浏览器会把同主机所有 http:// 访问都强制升级到 https。
    # 目前同主机上仍是明文的还有：
    #   8080（hrms-yiran-nginx）、8866（yiran-live-report-nginx），
    #   以及 3041（Wiki 的局域网明文兜底口）。
    # 一开 HSTS 这几个会直接打不开，等它们也上了 https 再放开下面这行：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
      # 用变量 + resolver 把上游解析推迟到请求时，app 没起来也不会让本层 nginx 启动失败
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $app_upstream app;
      proxy_pass http://$app_upstream:80;

      proxy_http_version 1.1;

      proxy_set_header Host             $http_host;
      proxy_set_header X-Real-IP        $remote_addr;
      proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;

      # 关键：后端 auth.js 的 isSecureRequest() / forwardedOrigin() 就靠这个头，
      # 它决定会话 Cookie 是否带 Secure、以及重定向 origin 用 http 还是 https。
      # 这里必须钉死成 https，不能透传客户端的值。
      proxy_set_header X-Forwarded-Proto https;

      # WebSocket：协同编辑走 /collab-v2 和 /socket.io/
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 5s;
      proxy_send_timeout    3600s;
      proxy_read_timeout    3600s;
      client_body_timeout   900s;

      # 大附件直传，不在 TLS 层落盘缓冲
      proxy_request_buffering off;
      proxy_buffering off;
    }
  }
}
