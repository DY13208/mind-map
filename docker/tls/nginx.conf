# 第一阶段：脑图迁移到 ai.stillgroup.net:8989；其他系统保留原域名与端口。
# 两个域名解析到同一公网 IP，按 TLS SNI 分别选择证书。
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 220m;

  # 不记录查询串，避免分享令牌和 OAuth code/state 进入日志。
  log_format tls_main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log tls_main;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # 暂不开 HSTS，xx 域名的其他端口仍可能使用 HTTP。

  server {
    listen 443 ssl default_server;
    http2 on;
    server_name ai.stillgroup.net;
    ssl_certificate     /etc/nginx/certs/ai.stillgroup.net.crt;
    ssl_certificate_key /etc/nginx/certs/ai.stillgroup.net.key;
    error_page 497 =302 https://ai.stillgroup.net:8989$request_uri;
    location / { include /etc/nginx/mind-map-proxy.conf; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name xx.stillgroup.net;
    # 保留服务器上已有的旧证书，旧链接才能先完成 TLS 握手再跳转。
    ssl_certificate     /etc/nginx/certs/xx.stillgroup.net.crt;
    ssl_certificate_key /etc/nginx/certs/xx.stillgroup.net.key;
    error_page 497 =302 https://ai.stillgroup.net:8989$request_uri;

    # 过渡期旧 API/MCP/协作/集成入口继续转发，避免让 POST 和 Authorization 依赖跨域跳转。
    location ~ ^/(api|mcp|mcp-upload|knowledge-mcp|file-kb-mcp|collab|collab-v2|socket[.]io|ai|yiran|jobhub|bridge|wb-api|openclaw-api|openclaw-bridge|cognee-api|wiki-compiler|[.]well-known)(/|$) {
      include /etc/nginx/mind-map-proxy.conf;
    }
    location = /oauth/callback { include /etc/nginx/mind-map-proxy.conf; }
    # 页面及分享链接迁到新域名；保留房间 ID、节点 ID 和查询参数。
    location / { return 302 https://ai.stillgroup.net:8989$request_uri; }
  }
}
