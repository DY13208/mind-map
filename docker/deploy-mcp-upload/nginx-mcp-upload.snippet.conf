# nginx：给「一次性直传票据」加 /mcp-upload/ 转发
#
# 服务器上有两层 nginx，两层都要加（只加一层会出现 405 或 404）：
#   1. 外层 nginx 1.22.1（TLS 终点，公网 8989）—— 它只把 `location = /mcp` 精确匹配
#      转发给应用，其他路径当静态文件处理，所以 POST /mcp-upload/x 会返回 405。
#   2. 内层 app nginx（在 mind-map 容器里，1.27.5）—— 它把 /mcp 转给 127.0.0.1:3847
#      （MCP 进程），也要为 /mcp-upload/ 开同样的转发。
#
# 插入位置：两处 nginx.conf 里已有 `location = /mcp { ... }`，把下面的块**贴在它后面**，
#           然后 nginx -t && nginx -s reload。容器内的 nginx.conf 若是从
#           /etc/nginx/nginx.conf.template 渲染出来的，两个文件都要改。
#
# 注意 proxy_pass 末尾**不要**带路径（写成 http://127.0.0.1:3847; 而不是 .../mcp;），
# 这样原始 URI /mcp-upload/<id> 会原样传给 MCP 进程。

# ---- 内层（mind-map 容器内，/etc/nginx/nginx.conf）----
location /mcp-upload/ {
    client_max_body_size 32m;
    client_body_timeout 900s;
    proxy_pass http://127.0.0.1:3847;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# ---- 外层（TLS 那一层，1.22.1）----
# 把 proxy_pass 换成它转发 /mcp 时用的同一个后端（可能是内层 nginx 的地址或 app 的 80 端口）。
location /mcp-upload/ {
    client_max_body_size 32m;
    client_body_timeout 900s;
    proxy_pass http://<与 location = /mcp 里相同的后端>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
