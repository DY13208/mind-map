user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 100m;
  log_format main_without_args '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent "$http_referer" '
                               '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main_without_args;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
      default_type application/json;
      add_header Cache-Control no-store;
      return 200 '{"ok":true,"gateway":true}';
    }

    location ~ ^/api/files/[^/]+/replace$ {
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_request_buffering off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location ~ ^/api/(?:files|maps|rooms)/[^/]+/attachments$ {
      client_max_body_size 220m;
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 900s;
      proxy_read_timeout 900s;
      client_body_timeout 900s;
      proxy_request_buffering off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location ^~ /api/attachments/resumable {
      client_max_body_size 16m;
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 900s;
      proxy_read_timeout 900s;
      client_body_timeout 900s;
      proxy_request_buffering off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:1234/api/;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location /collab-v2 {
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Socket.IO normally uses /socket.io/. Collaboration V2 deliberately
    # exposes the same Engine.IO endpoint at /collab-v2, so keep the default
    # path compatible without allowing History Mode to serve index.html.
    location = /socket.io {
      rewrite ^ /collab-v2/ break;
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location ^~ /socket.io/ {
      rewrite ^/socket\.io/(.*)$ /collab-v2/$1 break;
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /collab/ {
      proxy_pass http://127.0.0.1:1234/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location = /mcp {
      proxy_pass http://127.0.0.1:3847/mcp;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header mcp-session-id $http_mcp_session_id;
      proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
      proxy_set_header Accept $http_accept;
      proxy_buffering off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /ai/ {
      proxy_pass http://127.0.0.1:3456/ai/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # Yiran / Liangce Django API. The entrypoint replaces this placeholder
    # with either the local compose service or a separately deployed server.
    # Must stay before the catch-all SPA location; does not collide with /api/.
    location /yiran/ {
      proxy_pass __YIRAN_UPSTREAM__/;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Prefix /yiran;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /wb-api/ {
      proxy_pass http://host.docker.internal:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-WorkBuddy-Events $http_x_workbuddy_events;
      proxy_buffering off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # OpenClaw Gateway（同 compose 网络 openclaw-gateway，默认 18789）
    location /openclaw-api/ {
      proxy_pass http://openclaw-gateway:18789/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-OpenClaw-Model $http_x_openclaw_model;
      proxy_set_header X-OpenClaw-Session-Key $http_x_openclaw_session_key;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Accel-Buffering no;
      proxy_buffering off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # OpenClaw Bridge（Gateway WS → 浏览器简化协议）
    location /openclaw-bridge/ {
      proxy_pass http://host.docker.internal:18790/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Accel-Buffering no;
      proxy_buffering off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Cognee 知识图谱 API（密钥由网关注入，不暴露给浏览器）
    location /cognee-api/ {
      proxy_pass __COGNEE_UPSTREAM__/;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # 保留引号，未配置密钥时也输出合法的空请求头值。
      proxy_set_header X-Api-Key "__COGNEE_API_KEY__";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # filenameHashing 关闭后 css/js 文件名固定，禁止长期缓存以免发版后仍用旧包
    location ~* \.(?:js|css|map)$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-store";
      try_files $uri $uri/ /index.html;
    }
  }
}
