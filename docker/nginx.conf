user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 100m;
  log_format main_without_args '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent "$http_referer" '
                               '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main_without_args;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # 前面有 TLS 终止层（docker/tls）时，真实协议在 X-Forwarded-Proto 里。
  # 这里必须原样透传而不是用 $scheme：TLS 层到本容器是明文，$scheme 恒等于 http，
  # 后端 auth.js 会据此认为请求不安全，导致会话 Cookie 缺 Secure、
  # 重定向 origin 错成 http:// 而引发登录回跳失败。
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
      default_type application/json;
      add_header Cache-Control no-store;
      return 200 '{"ok":true,"gateway":true}';
    }

    location = /.well-known/oauth-authorization-server {
      proxy_pass http://127.0.0.1:1234;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location ~ ^/api/files/[^/]+/replace$ {
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_request_buffering off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location ~ ^/api/(?:files|maps|rooms)/[^/]+/attachments$ {
      client_max_body_size 220m;
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 900s;
      proxy_read_timeout 900s;
      client_body_timeout 900s;
      proxy_request_buffering off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location ^~ /api/attachments/resumable {
      client_max_body_size 16m;
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 900s;
      proxy_read_timeout 900s;
      client_body_timeout 900s;
      proxy_request_buffering off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:1234/api/;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_send_timeout 180s;
      proxy_read_timeout 180s;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
    }

    location /collab-v2 {
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Socket.IO normally uses /socket.io/. Collaboration V2 deliberately
    # exposes the same Engine.IO endpoint at /collab-v2, so keep the default
    # path compatible without allowing History Mode to serve index.html.
    location = /socket.io {
      rewrite ^ /collab-v2/ break;
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location ^~ /socket.io/ {
      rewrite ^/socket\.io/(.*)$ /collab-v2/$1 break;
      proxy_pass http://127.0.0.1:1234;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /collab/ {
      proxy_pass http://127.0.0.1:1234/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location = /mcp {
      proxy_pass http://127.0.0.1:3847/mcp;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header mcp-session-id $http_mcp_session_id;
      proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
      proxy_set_header Accept $http_accept;
      proxy_buffering off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Knowledge MCP（Wiki 全库只读）→ compose 服务 knowledge-mcp
    # 让 MCP 接入页与导图 MCP 共用同一主机端口，无需再开 18792。
    location /knowledge-mcp/ {
      proxy_pass http://knowledge-mcp:18792/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header mcp-session-id $http_mcp_session_id;
      proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
      proxy_set_header Accept $http_accept;
      proxy_buffering off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /ai/ {
      proxy_pass http://127.0.0.1:3456/ai/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # Yiran / Liangce Django API. The entrypoint replaces this placeholder
    # with either the local compose service or a separately deployed server.
    # Must stay before the catch-all SPA location; does not collide with /api/.
    location /yiran/ {
      proxy_pass __YIRAN_UPSTREAM__/;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Prefix /yiran;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # 通讯页（按钮派发主服务）。页面和通讯页不同源时浏览器会因跨源、以及
    # https 页面不许直连 http 地址（混合内容）把请求拦掉；同源转发一次就绕开了：
    # 页面请求 /jobhub/api/peers → 通讯页 /api/peers。
    # 上游默认是**宿主机的 5051**（通讯页直接在服务器上 python 跑）；
    # 通讯页跑在别的机器上时就改 JOBHUB_UPSTREAM，例如 http://192.168.0.54:5000。
    location ^~ /jobhub/ {
      # 挂附件走这条路（base64 的文件），别用默认 1m 卡住
      client_max_body_size 220m;
      proxy_pass __JOBHUB_UPSTREAM__/;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_request_buffering off;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Prefix /jobhub;
      proxy_buffering off;
    }

    # 桥接同源反代 —— 「执行主机就是页面这台机器」时用它。
    #
    # 为什么需要：浏览器的 127.0.0.1 永远是**打开页面的那台电脑**，不可能是服务器。
    # 页面部署在服务器上、任务也想由服务器上的 WorkBuddy 跑，就必须让页面走同源路径：
    # fetch /bridge/api/gateways → 服务器自己的 8799。这样没有跨源、没有 https→http
    # 混合内容，也不受 Chrome「本地网络访问」限制。
    #
    # 上游默认宿主机 8799（test1.py --lan）；要指向别的机器就设 BRIDGE_UPSTREAM。
    #
    # ⚠️ 这条等于把「派发任务」开放给能打开页面的所有人：别在公网裸奔。
    #    只在内网/VPN 用，或在宿主防火墙/上层反代按来源 IP 限制。
    location ^~ /bridge/ {
      client_max_body_size 220m;
      proxy_pass __BRIDGE_UPSTREAM__/;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_request_buffering off;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Prefix /bridge;
      proxy_buffering off;
    }

    location /wb-api/ {
      proxy_pass http://host.docker.internal:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-WorkBuddy-Events $http_x_workbuddy_events;
      proxy_buffering off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # OpenClaw Gateway（同 compose 网络 openclaw-gateway，默认 18789）
    # Gateway 是可选的附属服务：没开助理页时容器根本不存在。nginx 默认在
    # 启动时就解析 proxy_pass 里的主机名，解析不到会让整个 nginx 起不来、
    # 所有路由一起 502；所以这里用变量 + resolver 把解析推迟到请求时。
    location /openclaw-api/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $openclaw_upstream openclaw-gateway;
      rewrite ^/openclaw-api/(.*)$ /$1 break;
      proxy_pass http://$openclaw_upstream:18789;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-OpenClaw-Model $http_x_openclaw_model;
      proxy_set_header X-OpenClaw-Session-Key $http_x_openclaw_session_key;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Accel-Buffering no;
      proxy_buffering off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # OpenClaw Bridge（Gateway WS → 浏览器简化协议）
    location /openclaw-bridge/ {
      proxy_pass http://host.docker.internal:18790/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Accel-Buffering no;
      proxy_buffering off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Cognee 知识图谱 API（密钥由网关注入，不暴露给浏览器）
    location /cognee-api/ {
      proxy_pass __COGNEE_UPSTREAM__/;
      proxy_http_version 1.1;
      proxy_set_header Host $proxy_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      # 保留引号，未配置密钥时也输出合法的空请求头值。
      proxy_set_header X-Api-Key "__COGNEE_API_KEY__";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # filenameHashing 关闭后 css/js 文件名固定，禁止长期缓存以免发版后仍用旧包
    location ~* \.(?:js|css|map)$ {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-store";
      try_files $uri $uri/ /index.html;
    }
  }
}
